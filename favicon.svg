<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#9B040B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#E50914" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>
  
  <!-- Stylized APULA "A" Ribbon Symbol with Netflix Red Glow -->
  <g filter="url(#glow)">
    <!-- Left Leg -->
    <path d="M120 420 L230 92 L290 92 L180 420 Z" fill="url(#redGrad)"/>
    <!-- Right Leg -->
    <path d="M222 92 L282 92 L392 420 L332 420 Z" fill="#E50914" opacity="0.9"/>
    <!-- Center Ribbon Crossbar -->
    <path d="M165 290 L345 290 L325 340 L145 340 Z" fill="url(#redGrad)"/>
    <!-- Dynamic Cinema Play Triangle Accent -->
    <polygon points="360,230 420,265 360,300" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
